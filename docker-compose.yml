services:
  api:
    build:
      context: .
      # read from .env so the baked-in reranker matches the one the app loads
      args: { RERANK_MODEL: "${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}" }
    ports: ["7860:7860"]
    env_file: .env
    environment:
      FEEDBACK_PATH: /srv/feedback/feedback.jsonl
    # only feedback is persisted; mounting all of ./data would hide the index built into the image
    volumes: ["./data/feedback:/srv/feedback"]
